services:
  nginx:
    image: nginx
    volumes:
      - ./nginx/:/tmp/nginx/:ro
    environment:
      - API_KEY=${API_KEY}
    command: /bin/bash -c "cat /tmp/nginx/custom.conf.template | sed 's/API_KEY/${API_KEY}/g' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    ports:
      - 80:80
  api:
    build: api
  static:
    image: httpd:alpine
    volumes:
      - ./static/:/usr/local/apache2/htdocs/:ro